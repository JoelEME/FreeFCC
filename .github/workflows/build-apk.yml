name: Build Lito X1 Lab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Lito X1 Lab patch
        run: python3 patch/apply_lito_lab.py .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeFCC-LitoX1-Lab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFCC-LitoX1-Lab-APK
          path: FreeFCC-LitoX1-Lab-debug.apk
          if-no-files-found: error
